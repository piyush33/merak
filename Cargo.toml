[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
merak-ir = { path = "crates/merak-ir" }
merak-front-ts = { path = "crates/merak-front-ts" }
merak-behaviour = { path = "crates/merak-behaviour" }
merak-transition = { path = "crates/merak-transition" }
oxc_allocator = "0.151.0"
oxc_ast = "0.151.0"
oxc_parser = "0.151.0"
oxc_span = "0.151.0"
oxc_syntax = "0.151.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
blake3 = "1"
