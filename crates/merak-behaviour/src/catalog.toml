# Default effect catalog: which external APIs mean which behavioural effect.
#
# `api` patterns match Merak's canonical external names:
#   `<module>.<export>` for imports       e.g. `axios.post()`
#   `<module>.<Class>#` for instances     e.g. `@prisma/client.PrismaClient#.order.update()`
#   `name()` for globals                  e.g. `fetch()`
# `*` matches one segment, `**` any number of them; `{a,b}` expands to alternatives.
#
# Value specs: `seg:N` (segment N of the matched name, negative from the end),
# `arg:N` (constant string of argument N), `host:N` (host of the URL in argument N),
# `opt:N.key|DEFAULT` (property of an object argument), `lit:VALUE`.
# Add `:upper` to upper-case the result.
#
# Seeded from CodeQL's JavaScript framework models (ClientRequests, NoSQL,
# NodeJSLib, Express, EventEmitter); extend per project in merak.toml.

# ---- databases -------------------------------------------------------------
[[effect]]
api = "@prisma/client.PrismaClient#.*.{create,createMany,update,updateMany,upsert,delete,deleteMany}()"
kind = "db_write"
target = "seg:2"

[[effect]]
api = "@prisma/client.PrismaClient#.*.{findUnique,findUniqueOrThrow,findFirst,findFirstOrThrow,findMany,count,aggregate,groupBy}()"
kind = "db_read"
target = "seg:2"

[[effect]]
api = "{typeorm,mongoose,sequelize}.*#.{save,insert,update,delete,remove,upsert,create,destroy,updateOne,updateMany,deleteOne,deleteMany,insertMany}()"
kind = "db_write"
target = "seg:1"

[[effect]]
api = "{typeorm,mongoose,sequelize}.*#.{find,findOne,findBy,findOneBy,findAll,findByPk,count}()"
kind = "db_read"
target = "seg:1"

[[effect]]
api = "{pg,mysql,mysql2,mssql}.*#.{query,execute}()"
kind = "db_query"
target = "seg:0"

# Kysely: anywhere in a chain (`db.with(…).selectFrom()`) or on an expression
# builder (`eb.exists(eb.selectFrom(…))`).
[[effect]]
api = "kysely.**.{insertInto,replaceInto,updateTable,deleteFrom,mergeInto}()"
kind = "db_write"
target = "arg:0"

[[effect]]
api = "kysely.**.selectFrom()"
kind = "db_read"
target = "arg:0"

# ---- outbound HTTP ---------------------------------------------------------
[[effect]]
api = "{fetch(),node-fetch(),undici.fetch()}"
kind = "http"
target = "host:0"
method = "opt:1.method|GET"

[[effect]]
api = "axios.{get,post,put,patch,delete,head,request}()"
kind = "http"
target = "host:0"
method = "seg:1:upper"

[[effect]]
api = "{got,superagent}.{get,post,put,patch,delete}()"
kind = "http"
target = "host:0"
method = "seg:-1:upper"

# ---- events / queues / caches ----------------------------------------------
[[effect]]
api = "{node:events,events}.EventEmitter#.emit()"
kind = "event_emit"
target = "arg:0"

[[effect]]
api = "{bullmq,bull}.Queue#.add()"
kind = "queue"
target = "arg:0"

[[effect]]
api = "{ioredis,ioredis.Redis}#.{set,setex,del,hset,hdel,expire,incr,decr,lpush,rpush}()"
kind = "cache_write"
target = "lit:redis"

[[effect]]
api = "{ioredis,ioredis.Redis}#.{get,hget,hgetall,exists,lrange}()"
kind = "cache_read"
target = "lit:redis"

# ---- filesystem ------------------------------------------------------------
[[effect]]
api = "{fs,node:fs,fs/promises,node:fs/promises,fs.promises}.{writeFile,writeFileSync,appendFile,appendFileSync,unlink,unlinkSync,rm,rmSync,mkdir,mkdirSync,rename,renameSync}()"
kind = "fs_write"
target = "arg:0"

[[effect]]
api = "{fs,node:fs,fs/promises,node:fs/promises}.{readFile,readFileSync,readdir,readdirSync,stat,statSync}()"
kind = "fs_read"
target = "arg:0"

# ---- subscriptions & entry points ------------------------------------------
[[subscribe]]
api = "{node:events,events}.EventEmitter#.{on,once,addListener,prependListener}()"
event = "arg:0"
handler_arg = 1

# Decorator forms: no `handler_arg`, the decorated method is the handler.
[[subscribe]]
api = "@nestjs/event-emitter.OnEvent()"
event = "arg:0"

[[route]]
api = "{express.Router(),express()}.{get,post,put,patch,delete,all}()"
method = "seg:-1:upper"
path = "arg:0"
handler_arg = -1

[[route]]
api = "@nestjs/common.{Get,Post,Put,Patch,Delete,All,Head,Options}()"
method = "seg:-1:upper"
path = "arg:0|"
prefix = "@nestjs/common.Controller()"

# ---- logging ---------------------------------------------------------------
# Log calls are kept apart from behaviour: a change to them is LOGGING_CHANGED.
# Program-internal targets match by entity id (`src/x.ts::AppLogger.warn()`).
[[log]]
api = "{console.*(),**.Logger#.*(),**.*Logger#.*(),**.*::*Logger.*(),**.*::LoggingRepository.*()}"

# ---- validation schemas ----------------------------------------------------
# Module constants built from these roots are validation schemas. `docs` methods
# document a schema without changing what it accepts.
[schema]
roots = ["zod", "nestjs-zod"]
docs = ["describe", "meta", "openapi", "example", "title"]

# ---- access requirements -------------------------------------------------
# Object-argument keys that state an access requirement, at calls
# (`requireAccess({ auth, permission: Permission.AlbumRead })`) and decorators
# (`@Authenticated({ permission: … })`). `grants` keys open access instead.
[access]
keys = ["permission", "permissions", "role", "roles", "scope", "scopes", "admin", "isAdmin", "public"]
grants = ["public"]

# ---- query predicates ------------------------------------------------------
# Methods that narrow the rows a query reaches. The expression-builder forms are
# `eb(column, op, value)` and its combinators.
[[filter]]
api = "kysely.**.{where,whereRef,having,on,onRef}()"

[[filter]]
api = "kysely.ExpressionBuilder#{(),.and(),.or(),.not(),.exists(),.between()}"

# Calls that stand for a constant, e.g. sql.lit('hidden') is the literal `hidden`.
[[literal]]
api = "kysely.sql.{lit,val}()"

# Untyped callback parameters of query builders. First match wins;
# `receiver` is the builder the method is called on.
[[callback]]
api = "kysely.**.{$if,$call,with,withRecursive}()"
param = "receiver"

[[callback]]
api = "kysely.**.transaction().execute()"
param = "kysely.Transaction#"

[[callback]]
api = "kysely.**.{innerJoinLateral,leftJoinLateral,crossJoinLateral}()"
arg = 0
param = "kysely.ExpressionBuilder#"

[[callback]]
api = "kysely.**.{innerJoin,leftJoin,rightJoin,fullJoin,innerJoinLateral,leftJoinLateral}()"
param = "kysely.JoinBuilder#"

[[callback]]
api = "kysely.**.onConflict()"
param = "kysely.OnConflictBuilder#"

[[callback]]
api = "kysely.**"
param = "kysely.ExpressionBuilder#"
